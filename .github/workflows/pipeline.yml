name: LocalPulse Pipeline

# Trigger this workflow on every push to master
on:
  push:
    branches: [master]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repo code onto the GitHub runner machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install all project dependencies from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Step 4: Run all ingestion scripts to pull live data from APIs.
      # The API key is stored as a GitHub Secret — never in the code.
      # In your repo go to: Settings → Secrets → Actions → New repository secret
      # Name it API_DATA_GOV_KEY and paste your key as the value.
      - name: Ingest weather data
        run: python feature_store/ingest.py
        env:
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}

      - name: Ingest crime data
        run: python feature_store/ingest_crime.py
        env:
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}

      - name: Ingest school data
        run: python feature_store/ingest_schools.py
        env:
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}

      # Step 5: Run transforms and data quality checks.
      # If any quality check fails, this step fails and the workflow stops.
      - name: Run transforms and quality checks
        run: python transforms/transform.py
